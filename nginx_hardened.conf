# ==============================================================================
# CONFIGURAÇÃO NGINX HARDENED — RÁDIO VOX ARIEH
# Padrão de Cibersegurança: CIS Benchmarks & OWASP Top 10
# ==============================================================================

# Definição de Rate Limiting contra ataques DDoS / Força Bruta (adicione no bloco http{} do nginx.conf se desejar):
# limit_req_zone $binary_remote_addr zone=vox_limit:10m rate=15r/s;

server {
    listen 80;
    listen [::]:80;
    server_name radiovoxarieh.lexaapp.com.br;

    root /var/www/radio-vox-arieh;
    index index.html;

    # ==========================================================================
    # 1. CABEÇALHOS DE SEGURANÇA (SECURITY HEADERS)
    # ==========================================================================
    # Impede Clickjacking (não permite abrir seu site em iframes maliciosos externos)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Impede MIME-Type Sniffing (evita que navegadores executem arquivos como scripts)
    add_header X-Content-Type-Options "nosniff" always;

    # Ativa filtro XSS no navegador
    add_header X-XSS-Protection "1; mode=block" always;

    # Protege dados de referência entre sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desativa recursos desnecessários do dispositivo, permitindo microfone apenas na própria origem para transmissões/gravações
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;

    # ==========================================================================
    # 2. BLOQUEIO DE ARQUIVOS OCULTOS E CONFIDENCIAIS (ZERO LEAKS)
    # ==========================================================================
    # Bloqueia acesso a arquivos que começam com ponto (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueia tentativas de varredura de backups e scripts comuns
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # 3. ROTEAMENTO E ARQUIVOS ESTÁTICOS
    # ==========================================================================
    # Roteamento de API para o serviço backend de persistência ADM
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        # Aplica Rate Limiting para evitar sobrecarga (opcional se ativado)
        # limit_req zone=vox_limit burst=20 nodelay;

        try_files $uri $uri/ /index.html;
    }

    # Cache de alta performance para imagens e folhas de estilo (Assets)
    location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Desativa exibição da versão do Nginx (Information Disclosure Prevention)
    server_tokens off;
}
